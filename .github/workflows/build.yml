name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME).
      # On accepte seulement les licences pour que Gradle puisse télécharger ce qui manque.
      - name: Accepter les licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Pas de gradle wrapper dans le projet : on installe Gradle directement
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler l'APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: tvplayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
